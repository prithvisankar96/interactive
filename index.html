<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#0a0a0a" />
  <title>Silence — macOS Desktop</title>
  <meta name="description" content="A macOS desktop-style web experience: draggable icons, real windows, and a magnifying dock." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="stylesheet" href="styles.css" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%23111'/%3E%3Ccircle cx='50' cy='50' r='26' fill='none' stroke='%23fff' stroke-width='6'/%3E%3C/svg%3E" />
</head>
<body>
  <!-- ============ BOOT SCREEN ============ -->
  <div id="boot" class="boot">
    <svg class="boot-logo" viewBox="0 0 100 100" aria-hidden="true">
      <path d="M67 27c-4 0-8 2.5-11 2.5S49 27 45 27c-8 0-15 6.5-15 17 0 12 8.5 26 15.5 26 3 0 5-2 8.5-2s5.5 2 8.5 2c7 0 12-11 13.5-16-6-2.5-8-11-2.5-15.5-2-2.5-5-3.5-6.5-3.5zM56 15c1 5-3 10-8 10-1-5 3.5-10 8-10z" fill="#fff"/>
    </svg>
    <div class="boot-bar"><span id="bootFill"></span></div>
  </div>

  <!-- ============ DESKTOP ============ -->
  <div id="desktop" class="desktop hidden" aria-hidden="false">

    <!-- Menu bar -->
    <header class="menubar" id="menubar">
      <div class="menu-left">
        <button class="menu-item apple" aria-label="Apple menu">
          <svg viewBox="0 0 100 100" width="15" height="15"><path d="M67 27c-4 0-8 2.5-11 2.5S49 27 45 27c-8 0-15 6.5-15 17 0 12 8.5 26 15.5 26 3 0 5-2 8.5-2s5.5 2 8.5 2c7 0 12-11 13.5-16-6-2.5-8-11-2.5-15.5-2-2.5-5-3.5-6.5-3.5zM56 15c1 5-3 10-8 10-1-5 3.5-10 8-10z" fill="currentColor"/></svg>
        </button>
        <button class="menu-item strong" data-menu="app">Silence</button>
        <button class="menu-item" data-menu="file">File</button>
        <button class="menu-item" data-menu="edit">Edit</button>
        <button class="menu-item" data-menu="view">View</button>
        <button class="menu-item" data-menu="window">Window</button>
        <button class="menu-item" data-menu="help">Help</button>
      </div>
      <div class="menu-right">
        <button class="tray-item" id="trayBattery" aria-label="Battery" title="Battery">
          <svg viewBox="0 0 30 14" width="26" height="13"><rect x="1" y="1" width="24" height="12" rx="3" fill="none" stroke="currentColor" stroke-width="1.2" opacity=".55"/><rect x="3" y="3" width="18" height="8" rx="1.5" fill="currentColor"/><rect x="26" y="4.5" width="2.2" height="5" rx="1" fill="currentColor" opacity=".55"/></svg>
        </button>
        <button class="tray-item" aria-label="Wi-Fi" title="Wi-Fi">
          <svg viewBox="0 0 20 16" width="17" height="14"><path d="M10 13.5l2.4-3a3 3 0 0 0-4.8 0zM4.6 6.7l1.7 2.1a6 6 0 0 1 7.4 0l1.7-2.1a9 9 0 0 0-10.8 0zM1.4 2.7L3 4.9a13 13 0 0 1 14 0l1.6-2.2a16 16 0 0 0-17.2 0z" fill="currentColor"/></svg>
        </button>
        <button class="tray-item" id="trayControl" aria-label="Control Center" title="Control Center">
          <svg viewBox="0 0 24 24" width="16" height="16"><rect x="2" y="3" width="20" height="8" rx="4" fill="none" stroke="currentColor" stroke-width="1.4"/><circle cx="8" cy="7" r="2.2" fill="currentColor"/><rect x="2" y="13" width="20" height="8" rx="4" fill="none" stroke="currentColor" stroke-width="1.4"/><circle cx="16" cy="17" r="2.2" fill="currentColor"/></svg>
        </button>
        <button class="tray-item" id="traySearch" aria-label="Spotlight" title="Search">
          <svg viewBox="0 0 24 24" width="16" height="16"><circle cx="10.5" cy="10.5" r="6.5" fill="none" stroke="currentColor" stroke-width="1.6"/><line x1="15.5" y1="15.5" x2="21" y2="21" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
        </button>
        <button class="tray-item clock" id="clock" title="Date and time"></button>
      </div>
    </header>

    <!-- Dropdown menus -->
    <div class="dropdown" id="dropdown" hidden></div>

    <!-- Desktop icons layer -->
    <main class="icon-field" id="iconField"></main>

    <!-- Windows are injected here -->
    <div class="window-layer" id="windowLayer"></div>

    <!-- Context menu -->
    <div class="context-menu" id="contextMenu" hidden>
      <button data-act="new-note">New Note</button>
      <button data-act="clean">Clean Up Icons</button>
      <button data-act="wallpaper">Change Wallpaper</button>
      <div class="ctx-sep"></div>
      <button data-act="about">About Silence</button>
    </div>

    <!-- Dock -->
    <nav class="dock-wrap" id="dockWrap">
      <ul class="dock" id="dock"></ul>
    </nav>
  </div>

  <script src="app.js"></script>
</body>
</html>
